<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeCam</title>
<meta name="description" content="The Human Eye as a Camera (Mann et al., IEEE HealthCom 2019) — SSVEP imaging with a Muse EEG headband.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="eye">◉</span> EyeCam <span class="muted">— the human eye as a camera</span></div>
  <div class="conn">
    <span id="dot" class="dot"></span>
    <span id="conn-status" class="muted">not connected</span>
    <span id="conn-info" class="muted small"></span>
    <label class="small" title="Enable the Muse auxiliary input (extra Oz electrode on the micro-USB port, preset p20)"><input type="checkbox" id="aux"> AUX/Oz</label>
    <button id="btn-muse" class="primary">Connect Muse</button>
    <button id="btn-bridge" title="python server.py --muse (muselsl → LSL → WebSocket)">Python bridge</button>
    <button id="btn-sim" title="Synthetic EEG whose SSVEP follows what is on screen">Simulator</button>
    <button id="btn-disc">Disconnect</button>
    <button id="btn-settings">Analysis</button>
    <button id="btn-hw">Hardware</button>
  </div>
</header>
<section id="settings-panel" class="drawer"><div id="settings-body"></div></section>
<section id="hw-panel" class="drawer"><div id="hw-body"></div></section>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
